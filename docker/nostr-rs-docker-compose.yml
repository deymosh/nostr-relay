services:

  # Nostr-RS Relay Service
  nostr-rs-relay:
    build: ../nostr-rs-relay
    image: nostr-rs-relay
    container_name: nostr-rs-relay
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../config.toml:/usr/src/app/config.toml
      - ../data/nostr-rs-relay:/usr/src/app/db
    networks:
      nostr-relay-net:
        ipv4_address: 172.20.0.2

  # Tor Hidden Service
  tor:
    image: lncm/tor:latest
    container_name: nostr-rs-tor
    restart: unless-stopped
    user: "root"
    entrypoint: /init-tor.sh
    volumes:
      - tor-data:/var/lib/tor
      - ./torrc.nostr-rs:/etc/tor/torrc
      - ./init-tor.sh:/init-tor.sh:ro
    networks:
      nostr-relay-net:
        ipv4_address: 172.20.0.3

networks:
  nostr-relay-net:
    name: nostr-relay-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  tor-data:
    name: tor-data
